<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(60, 45)">
    <!-- 4-Pole / 3-Phase Wide Breaker Shell -->
    <rect x="0" y="0" width="280" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Header display and smart Wi-Fi section -->
    <rect x="20" y="20" width="240" height="90" rx="8" fill="#0f172a"/>
    <!-- Digital LCD display -->
    <rect x="35" y="32" width="140" height="45" rx="4" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
    <text x="45" y="55" fill="#34d399" font-family="Courier, monospace" font-weight="bold" font-size="15">380V  63A</text>
    <text x="45" y="70" fill="#34d399" font-family="Courier, monospace" font-size="10">3P+N  23.5kW</text>
    <!-- Wi-Fi Status LED -->
    <circle cx="205" cy="45" r="7" fill="#3b82f6"/>
    <text x="205" y="70" fill="#93c5fd" font-family="Arial, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Wi-Fi</text>
    <!-- Brand -->
    <text x="140" y="135" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1">HUNONIC 3-PHASE</text>
    <text x="140" y="153" fill="#ea580c" font-family="Arial, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">APTOMAT THÔNG MINH 3P</text>
    <!-- 4 Toggle switches (L1, L2, L3, N) -->
    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="45" height="75" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <rect x="8" y="10" width="29" height="35" rx="3" fill="#dc2626"/>
      <text x="22" y="70" fill="#475569" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">L1</text>
    </g>
    <g transform="translate(88, 175)">
      <rect x="0" y="0" width="45" height="75" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <rect x="8" y="10" width="29" height="35" rx="3" fill="#dc2626"/>
      <text x="22" y="70" fill="#475569" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">L2</text>
    </g>
    <g transform="translate(146, 175)">
      <rect x="0" y="0" width="45" height="75" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <rect x="8" y="10" width="29" height="35" rx="3" fill="#dc2626"/>
      <text x="22" y="70" fill="#475569" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">L3</text>
    </g>
    <g transform="translate(204, 175)">
      <rect x="0" y="0" width="45" height="75" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <rect x="8" y="10" width="29" height="35" rx="3" fill="#2563eb"/>
      <text x="22" y="70" fill="#475569" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">N</text>
    </g>
    <!-- Trip / Test Button -->
    <rect x="40" y="265" width="200" height="25" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="140" y="282" fill="#dc2626" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">NÚT TEST CHỐNG GIẬT ELCB HÀNG THÁNG</text>
  </g>
</svg>