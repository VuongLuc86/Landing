<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="solarCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(140, 60)">
    <!-- Solar Panel (Angled) -->
    <polygon points="-80,0 120,-30 180,45 -20,75" fill="url(#solarCell)" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Solar grid lines -->
    <line x1="-30" y1="-15" x2="30" y2="60" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="-23" x2="80" y2="52" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="-26" x2="130" y2="48" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <!-- Support arm to camera -->
    <path d="M50,45 L50,110 L90,140" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- 4G Dual Antennas -->
    <line x1="75" y1="120" x2="50" y2="40" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <line x1="105" y1="120" x2="130" y2="40" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Outdoor PTZ Camera Body -->
    <g transform="translate(90, 160)">
      <!-- Top dome base -->
      <path d="M-40,0 L40,0 L30,40 L-30,40 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <!-- Sphere Camera Housing -->
      <circle cx="0" cy="65" r="45" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="65" r="28" fill="#09090b"/>
      <!-- Lens -->
      <circle cx="0" cy="65" r="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="-4" cy="61" r="5" fill="#ffffff" opacity="0.8"/>
      <!-- IR & White LEDs around lens -->
      <circle cx="-18" cy="65" r="3" fill="#ef4444"/>
      <circle cx="18" cy="65" r="3" fill="#ef4444"/>
      <circle cx="0" cy="47" r="3" fill="#fef08a"/>
      <circle cx="0" cy="83" r="3" fill="#fef08a"/>
      <!-- 4G SIM Badge -->
      <rect x="-32" y="115" width="64" height="20" rx="4" fill="#2563eb"/>
      <text x="0" y="129" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">4G SIM LTE</text>
    </g>
  </g>
</svg>