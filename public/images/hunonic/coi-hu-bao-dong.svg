<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="strobeRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(200, 200)">
    <!-- Base Mounting Plate -->
    <rect x="-120" y="-120" width="240" height="240" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <!-- Red Strobe Flash Dome -->
    <circle cx="0" cy="-25" r="65" fill="url(#strobeRed)" stroke="#b91c1c" stroke-width="3"/>
    <!-- Siren Grille Slits -->
    <rect x="-80" y="55" width="160" height="8" rx="4" fill="#64748b"/>
    <rect x="-70" y="70" width="140" height="8" rx="4" fill="#64748b"/>
    <rect x="-60" y="85" width="120" height="8" rx="4" fill="#64748b"/>
    <!-- Strobe flash lines -->
    <line x1="-85" y1="-70" x2="-60" y2="-50" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="-70" x2="60" y2="-50" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-105" x2="0" y2="-80" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <!-- Label -->
    <text x="0" y="-20" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="16" text-anchor="middle">110 dB</text>
    <text x="0" y="110" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="11" text-anchor="middle">HUNONIC SIREN ALARM</text>
  </g>
</svg>