<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldFanRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="280" height="280" rx="16" fill="url(#goldFanRim)"/>
    <rect x="6" y="6" width="268" height="268" rx="12" fill="#09090b"/>
    <text x="140" y="45" fill="#94a3b8" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">HUNONIC FAN SPEED</text>
    <!-- Fan Speed Levels -->
    <g transform="translate(140, 140)">
      <!-- Fan Blades Icon -->
      <circle cx="0" cy="0" r="48" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
      <path d="M0,-8 C-12,-30 0,-40 10,-35 C14,-22 5,-12 0,-8 Z" fill="#38bdf8"/>
      <path d="M7,4 C26,18 36,9 31,-1 C20,-4 10,2 7,4 Z" fill="#38bdf8"/>
      <path d="M-7,4 C-26,18 -36,9 -31,-1 C-20,-4 -10,2 -7,4 Z" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    </g>
    <!-- Speed level dots 1-5 -->
    <g fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">
      <circle cx="70" cy="225" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="70" y="228" fill="#ffffff">1</text>
      <circle cx="105" cy="225" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="105" y="228" fill="#ffffff">2</text>
      <circle cx="140" cy="225" r="10" fill="#0284c7"/><text x="140" y="228" fill="#ffffff">3</text>
      <circle cx="175" cy="225" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="175" y="228" fill="#ffffff">4</text>
      <circle cx="210" cy="225" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="210" y="228" fill="#ffffff">5</text>
    </g>
    <text x="140" y="255" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">ĐIỀU TỐC QUẠT TRẦN 5 CẤP ĐỘ</text>
  </g>
</svg>