<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="glassFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(60, 60)">
    <!-- Beveled Gold Edge -->
    <rect x="0" y="0" width="280" height="280" rx="16" fill="url(#goldRim)"/>
    <!-- Tempered Glass Surface -->
    <rect x="6" y="6" width="268" height="268" rx="12" fill="url(#glassFace)"/>
    <!-- Hunonic Brand -->
    <text x="140" y="45" fill="#94a3b8" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">HUNONIC LUXURY</text>
    <!-- Button 1: Open Curtain (Mở) -->
    <g transform="translate(45, 120)">
      <circle cx="25" cy="25" r="28" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M15,18 L35,18 M15,32 L35,32 M25,18 L25,32 M15,25 L10,25 M35,25 L40,25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="25" y="68" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">MỞ</text>
    </g>
    <!-- Button 2: Pause Curtain (Dừng) -->
    <g transform="translate(115, 120)">
      <circle cx="25" cy="25" r="28" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <rect x="17" y="17" width="5" height="16" rx="2" fill="#38bdf8"/>
      <rect x="28" y="17" width="5" height="16" rx="2" fill="#38bdf8"/>
      <text x="25" y="68" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">DỪNG</text>
    </g>
    <!-- Button 3: Close Curtain (Đóng) -->
    <g transform="translate(185, 120)">
      <circle cx="25" cy="25" r="28" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M15,18 L35,18 M15,32 L35,32 M15,25 L35,25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="25" y="68" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">ĐÓNG</text>
    </g>
    <text x="140" y="240" fill="#64748b" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">SMART CURTAIN SWITCH</text>
  </g>
</svg>