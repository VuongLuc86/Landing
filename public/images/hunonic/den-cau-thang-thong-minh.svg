<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(60, 50)">
    <!-- Controller Hub DIN rail mount -->
    <rect x="0" y="0" width="280" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Display & Indicator LEDs -->
    <rect x="20" y="20" width="240" height="60" rx="8" fill="#0f172a"/>
    <text x="140" y="45" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="middle">HUNONIC STEP LADDER</text>
    <text x="140" y="65" fill="#22c55e" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">HIỆU ỨNG BƯỚC ĐI CẦU THANG 32 BẬC</text>
    <!-- Staircase cascading light effect graphic -->
    <g transform="translate(40, 100)">
      <rect x="0" y="140" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><rect x="25" y="122" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><rect x="50" y="104" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><rect x="75" y="86" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><rect x="100" y="68" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><rect x="125" y="50" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><rect x="150" y="32" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><rect x="175" y="14" width="28" height="12" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    </g>
    <!-- Sensor A & Sensor B indicators -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="95" height="30" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="47" y="19" fill="#0369a1" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Cảm biến Dưới</text>
    </g>
    <g transform="translate(155, 240)">
      <rect x="0" y="0" width="95" height="30" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="47" y="19" fill="#0369a1" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Cảm biến Trên</text>
    </g>
  </g>
</svg>