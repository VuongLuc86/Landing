<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(80, 70)">
    <!-- Weatherproof Stainless 304 Rim Lock Case -->
    <rect x="0" y="0" width="210" height="250" rx="12" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <!-- Waterproof Rain Cover Hood -->
    <path d="M-8,0 L218,0 L205,-18 L5,-18 Z" fill="#64748b"/>
    <!-- Biometric Fingerprint & Keypad Module (Sealed IP66) -->
    <rect x="25" y="25" width="160" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Scanner Glow -->
    <circle cx="105" cy="65" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="70" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">FINGERPRINT</text>
    <!-- Keypad dots -->
    <circle cx="65" cy="115" r="8" fill="#334155"/><circle cx="105" cy="115" r="8" fill="#334155"/><circle cx="145" cy="115" r="8" fill="#334155"/>
    <circle cx="65" cy="145" r="8" fill="#334155"/><circle cx="105" cy="145" r="8" fill="#334155"/><circle cx="145" cy="145" r="8" fill="#334155"/>
    <!-- Mechanical Key Hole Backup -->
    <circle cx="105" cy="205" r="14" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <rect x="103" y="198" width="4" height="14" fill="#0f172a"/>
    <!-- Heavy Duty Deadbolts (Right) -->
    <rect x="210" y="55" width="35" height="24" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="210" y="95" width="35" height="24" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="210" y="135" width="35" height="24" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  </g>
</svg>