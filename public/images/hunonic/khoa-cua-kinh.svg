<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="glassLockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(100, 50)">
    <!-- Glass Door Clamp Plate -->
    <rect x="0" y="0" width="130" height="300" rx="16" fill="url(#glassLockBody)" stroke="#52525b" stroke-width="3"/>
    <!-- Keypad & Fingerprint area -->
    <circle cx="65" cy="50" r="24" fill="#09090b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M55,50 C55,42 75,42 75,50 C75,56 60,56 60,60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="65" y="90" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">VÂN TAY BÁN DẪN</text>
    <!-- Touch Numeric Keypad -->
    <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">
      <text x="35" y="125">1</text><text x="65" y="125">2</text><text x="95" y="125">3</text>
      <text x="35" y="155">4</text><text x="65" y="155">5</text><text x="95" y="155">6</text>
      <text x="35" y="185">7</text><text x="65" y="185">8</text><text x="95" y="185">9</text>
      <text x="35" y="215">*</text><text x="65" y="215">0</text><text x="95" y="215">#</text>
    </g>
    <!-- RFID Card Area -->
    <rect x="25" y="235" width="80" height="35" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="65" y="256" fill="#93c5fd" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">CARD RFID</text>
    <!-- Glass Clamp Side Catch -->
    <rect x="145" y="30" width="55" height="240" rx="12" fill="url(#glassLockBody)" stroke="#52525b" stroke-width="3"/>
    <rect x="130" y="130" width="25" height="40" rx="4" fill="#71717a"/>
  </g>
</svg>