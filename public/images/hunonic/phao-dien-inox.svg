<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="inoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(200, 30)">
    <!-- Top threaded mount and waterproof wire -->
    <rect x="-8" y="0" width="16" height="45" fill="#ea580c"/>
    <rect x="-20" y="45" width="40" height="25" rx="3" fill="url(#inoxGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Vertical Inox Rod Guide -->
    <rect x="-5" y="70" width="10" height="250" fill="url(#inoxGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Upper Inox Float Ball -->
    <circle cx="0" cy="130" r="32" fill="url(#inoxGrad)" stroke="#334155" stroke-width="2"/>
    <rect x="-15" y="105" width="30" height="8" rx="2" fill="#475569"/>
    <!-- Lower Inox Float Ball -->
    <circle cx="0" cy="250" r="32" fill="url(#inoxGrad)" stroke="#334155" stroke-width="2"/>
    <rect x="-15" y="280" width="30" height="8" rx="2" fill="#475569"/>
    <!-- Labels -->
    <rect x="-130" y="115" width="85" height="30" rx="4" fill="#0284c7"/>
    <text x="-87" y="134" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Mực nước ngắt</text>
    <rect x="-130" y="235" width="85" height="30" rx="4" fill="#16a34a"/>
    <text x="-87" y="254" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Mực nước bơm</text>
    <text x="75" y="180" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="12">INOX 304</text>
    <text x="75" y="198" fill="#dc2626" font-family="Arial, sans-serif" font-weight="bold" font-size="10">AN TOÀN 12V</text>
  </g>
</svg>