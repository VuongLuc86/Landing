<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(130, 40)">
    <!-- Keychain loop top -->
    <circle cx="70" cy="30" r="22" fill="none" stroke="url(#metalBezel)" stroke-width="5"/>
    <!-- Remote Body with Brushed Metal & Carbon Texture -->
    <rect x="0" y="45" width="140" height="260" rx="25" fill="#0f172a" stroke="url(#metalBezel)" stroke-width="4"/>
    <!-- Sliding Cover Groove -->
    <rect x="15" y="60" width="110" height="155" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- RF Status LED indicator -->
    <circle cx="70" cy="78" r="4" fill="#38bdf8"/>
    <!-- Button A -->
    <g transform="translate(30, 95)">
      <circle cx="18" cy="18" r="17" fill="url(#metalBezel)" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="24" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="middle">A</text>
    </g>
    <!-- Button B -->
    <g transform="translate(74, 95)">
      <circle cx="18" cy="18" r="17" fill="url(#metalBezel)" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="24" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="middle">B</text>
    </g>
    <!-- Button C -->
    <g transform="translate(30, 145)">
      <circle cx="18" cy="18" r="17" fill="url(#metalBezel)" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="24" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="middle">C</text>
    </g>
    <!-- Button D -->
    <g transform="translate(74, 145)">
      <circle cx="18" cy="18" r="17" fill="url(#metalBezel)" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="24" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="middle">D</text>
    </g>
    <!-- Hunonic Branding -->
    <text x="70" y="250" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">HUNONIC</text>
    <text x="70" y="270" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">433MHz RF REMOTE</text>
  </g>
</svg>