<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(70, 30)">
    <!-- Weatherproof Metal Cabinet Body -->
    <rect x="0" y="0" width="260" height="340" rx="12" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <!-- Door Panel Bevel -->
    <rect x="15" y="15" width="230" height="310" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Top Weather Rain Hood -->
    <path d="M-10,0 L270,0 L255,-18 L5,-18 Z" fill="#94a3b8"/>
    <!-- Indicator Pilot Lights: Red, Yellow, Green -->
    <circle cx="65" cy="55" r="16" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <text x="65" y="85" fill="#475569" font-family="Arial, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Pha A</text>
    <circle cx="130" cy="55" r="16" fill="#eab308" stroke="#a16207" stroke-width="2"/>
    <text x="130" y="85" fill="#475569" font-family="Arial, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Pha B</text>
    <circle cx="195" cy="55" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="195" y="85" fill="#475569" font-family="Arial, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Pha C</text>
    <!-- Digital Multimeter / Ammeter Display -->
    <rect x="45" y="105" width="170" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="130" y="132" fill="#38bdf8" font-family="Courier, monospace" font-weight="bold" font-size="16" text-anchor="middle">380V | 10HP</text>
    <text x="130" y="148" fill="#4ade80" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">HUNONIC FARM 4G LTE</text>
    <!-- Rotary Cam Switches for Auto/Manual -->
    <g transform="translate(65, 200)">
      <circle cx="0" cy="0" r="22" fill="#1e293b"/>
      <rect x="-4" y="-20" width="8" height="26" rx="3" fill="#ffffff"/>
      <text x="0" y="35" fill="#334155" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">BƠM 1</text>
    </g>
    <g transform="translate(195, 200)">
      <circle cx="0" cy="0" r="22" fill="#1e293b"/>
      <rect x="-4" y="-20" width="8" height="26" rx="3" fill="#ffffff"/>
      <text x="0" y="35" fill="#334155" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">BƠM 2</text>
    </g>
    <!-- Lock Handle -->
    <rect x="225" y="160" width="12" height="45" rx="3" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Warning Sign -->
    <rect x="65" y="260" width="130" height="40" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="130" y="278" fill="#854d0e" font-family="Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle">⚠ ĐIỆN ÁP CAO 380V</text>
    <text x="130" y="292" fill="#713f12" font-family="Arial, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">TỦ ĐIỀU KHIỂN TƯỚI TỰ ĐỘNG</text>
  </g>
</svg>